name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # daily: picks up new Forever beta builds from wago.tools
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache wago.tools downloads
        uses: actions/cache@v4
        with:
          path: cache
          key: wago-${{ hashFiles('builds/LATEST') }}
          restore-keys: wago-

      - name: Build site for the latest Forever build
        run: python build.py --latest

      - name: Commit new build snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds
          if git diff --cached --quiet; then
            echo "no new build"
          else
            git commit -m "Snapshot build $(cat builds/LATEST)"
            git push
          fi

      - name: Stamp asset URLs with the commit hash (cache busting)
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
